[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    individual: marks tests for individual student testing
    range: marks tests for student range testing
    logic: marks tests for logic validation
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
